  <style>
    .gallery-page {
      padding-top: var(--nav-h);
      min-height: 100vh;
      background: var(--cream);
    }
    .gallery-page .gallery-header {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .gallery-page .gallery-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 800;
      color: var(--forest-deep);
      margin-bottom: 0.5rem;
    }
    .gallery-page .gallery-header p {
      color: var(--ink-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .gallery-page .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .gallery-page .filter-btn {
      padding: 0.5rem 1rem;
      border: 2px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .gallery-page .filter-btn:hover,
    .gallery-page .filter-btn.active {
      background: var(--gold);
      color: var(--white);
    }
    .gallery-page .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .gallery-page .back-link:hover {
      color: var(--forest-deep);
    }
    .gallery-page .gallery-container {
      width: min(1200px, 100% - 3rem);
      margin-inline: auto;
      padding-bottom: 4rem;
    }
    .gallery-page .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      grid-auto-flow: dense;
    }
    .gallery-page .gallery-item {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--cream-dim);
      aspect-ratio: 4/3;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), opacity 0.3s var(--ease);
    }
    .gallery-page .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    .gallery-page .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s var(--ease);
    }
    .gallery-page .gallery-item:hover img {
      transform: scale(1.05);
    }
    .gallery-page .gallery-item .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,36,24,0.75) 0%, transparent 60%);
      display: flex;
      align-items: flex-end;
      padding: 1.25rem;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
      pointer-events: none;
    }
    .gallery-page .gallery-item:hover .overlay {
      opacity: 1;
    }
    .gallery-page .gallery-item.hidden {
      display: none;
    }
    .gallery-page .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10,36,24,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 1000;
      overflow: hidden;
    }
    .gallery-page .lightbox.open {
      display: flex;
    }
    .gallery-page .lightbox-content {
      position: relative;
      width: min(95vw, 1000px);
      max-height: 90vh;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: center;
    }
    .gallery-page .lightbox-img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      background: var(--cream);
    }
    .gallery-page .lightbox-caption {
      color: var(--white);
      text-align: center;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .gallery-page .lightbox-close,
    .gallery-page .lightbox-nav {
      position: absolute;
      border: none;
      background: rgba(255,255,255,0.15);
      color: var(--white);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .gallery-page .lightbox-close:hover,
    .gallery-page .lightbox-nav:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
    .gallery-page .lightbox-close {
      top: 1rem;
      right: 1rem;
    }
    .gallery-page .lightbox-nav.prev {
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
    }
    .gallery-page .lightbox-nav.next {
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
    }
    @media (max-width: 768px) {
      .gallery-page .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
      .gallery-page .gallery-item {
        aspect-ratio: 1;
      }
    }
    @media (max-width: 480px) {
      .gallery-page .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    // Set year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Gallery filtering
    const filterButtons = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Remove active class from all buttons
        filterButtons.forEach(btn => btn.classList.remove('active'));
        // Add active class to clicked button
        button.classList.add('active');

        const filterValue = button.getAttribute('data-filter');

        galleryItems.forEach(item => {
          if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
            item.classList.remove('hidden');
            item.style.display = 'block';
          } else {
            item.classList.add('hidden');
            item.style.display = 'none';
          }
        });
      });
    });
  </script>

  <!-- Load main script for language switching and navigation -->
  <script src="script.js"></script>
